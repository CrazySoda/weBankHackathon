# LiteLLM proxy — REFERENCE TEMPLATE.
#
# The proxy never uses this file directly. At startup the entrypoint (see
# docker-compose.yml or scripts/start_proxy.sh) renders the real config:
#
#   python /render/litellm_render.py > config.yaml && litellm --config config.yaml
#
# driven by these env vars (see .env.example):
#
#   LLM_PROVIDER         anthropic | openai | google | ollama
#   LLM_REASONER_MODEL   override, LiteLLM string with provider prefix
#   LLM_FAST_MODEL       override
#   <PROVIDER>_API_KEYS  comma-separated rotation pool, one deployment per key
#
# Rendered shape (anthropic, 3 keys):
#
#   model_list:
#     - model_name: reasoner              # deployment 1 (key #1)
#       litellm_params:
#         model: anthropic/claude-sonnet-5-5
#         api_key: os.environ/LLM_KEY_1
#         max_tokens: 4096
#         timeout: 30
#     - model_name: reasoner              # deployment 2 (key #2)  ← rotation
#       litellm_params: {model: anthropic/claude-sonnet-5-5, api_key: os.environ/LLM_KEY_2, ...}
#     - model_name: reasoner              # deployment 3 (key #3)
#       litellm_params: {model: anthropic/claude-sonnet-5-5, api_key: os.environ/LLM_KEY_3, ...}
#     - model_name: fast                  # same pool shape for the fast alias
#       litellm_params: {model: anthropic/claude-haiku-5-5, api_key: os.environ/LLM_KEY_1, ...}
#     ...
#
#   router_settings:
#     num_retries: 2
#     timeout: 30
#     allowed_fails: 3        # 3 failures → key is benched
#     cooldown_time: 30       # ...for 30 s (429/503 handled here, not in the app)
#     fallbacks:
#       - reasoner: [fast]    # all reasoner keys down → fast (flagged degraded;
#                             # safety-critical nodes refuse degraded calls)
#
# SECURITY NOTES (BUILD_PLAN §0.11/0.12):
# - Image pinned by digest in docker-compose.yml. Versions 1.82.7/1.82.8 were
#   malicious; we pin v1.105.0.
# - Secrets live ONLY in the environment; the rendered config contains
#   `os.environ/` references, never keys.
# - The backend authenticates with a virtual key carrying a spend cap; the
#   master key never leaves the proxy host.
# - The admin UI is not exposed (no public port).
